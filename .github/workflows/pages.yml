name: Publicera Sagostund

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repositoryt
        uses: actions/checkout@v6

      - name: Installera Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bygg och testa webbplatsen
        run: npm test

      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5

      - name: Packa webbplatsen
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
